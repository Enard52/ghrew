name: Ghrew sign-in
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: ${{ startsWith(github.event.issue.title, 'Ghrew vault ') && 'ghrew-vault' || format('ghrew-auth-{0}', github.event.issue.user.id) }}
  cancel-in-progress: false
  queue: max
jobs:
  sign-in:
    if: startsWith(github.event.issue.title, 'Ghrew auth ') || startsWith(github.event.issue.title, 'Ghrew vault ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/action-auth.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAILBOX_PRIVATE_KEY: ${{ secrets.MAILBOX_PRIVATE_KEY }}
          GHREW_APP_PRIVATE_KEY: ${{ secrets.GHREW_APP_PRIVATE_KEY }}
